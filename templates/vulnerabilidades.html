<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>SecureScan - Vulnerabilidades</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #0d0d12; font-family: 'Inter', sans-serif; }
    </style>
<link rel="stylesheet" href="/static/css/theme.css">
</head>
<body class="min-h-screen text-gray-200 flex">
    <!-- Sidebar -->
    <aside class="w-64 bg-[#12121a] border-r border-[#1e1e2d] flex flex-col justify-between p-5 min-h-screen shrink-0">
        <div>
            <div class="flex items-center gap-3 px-2 py-4 mb-6">
                <div class="bg-[#6c47ff]/20 p-2 rounded-xl border border-[#6c47ff]/30 text-[#6c47ff]">
                    <i data-lucide="shield" class="w-6 h-6"></i>
                </div>
                <span class="text-lg font-bold text-white tracking-wide">SecureScan</span>
            </div>
            <nav class="space-y-1.5">
                <a href="/dashboard" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-[#1a1a26] font-medium text-sm rounded-xl transition-all">
                    <i data-lucide="layout-grid" class="w-4 h-4"></i>
                    Dashboard
                </a>
                <a href="/nuevo-analisis" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-[#1a1a26] font-medium text-sm rounded-xl transition-all">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i>
                    Nuevo análisis
                </a>
                <a href="/historial" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-[#1a1a26] font-medium text-sm rounded-xl transition-all">
                    <i data-lucide="history" class="w-4 h-4"></i>
                    Historial
                </a>
                <a href="/resultados" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-[#1a1a26] font-medium text-sm rounded-xl transition-all">
                    <i data-lucide="file-text" class="w-4 h-4"></i>
                    Resultados
                </a>
                <a href="/vulnerabilidades" class="flex items-center gap-3 px-4 py-3 bg-[#6c47ff]/15 text-[#8b5cf6] font-semibold text-sm rounded-xl border border-[#6c47ff]/20">
                    <i data-lucide="shield-alert" class="w-4 h-4"></i>
                    Vulnerabilidades
                </a>
                <a href="/configuracion" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-[#1a1a26] font-medium text-sm rounded-xl transition-all">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                    Configuración
                </a>
            </nav>
        </div>
        <div class="pt-4 border-t border-[#1e1e2d]">
            <a href="/logout" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-red-400 hover:bg-red-500/10 font-medium text-sm rounded-xl transition-all">
                <i data-lucide="log-out" class="w-4 h-4"></i>
                Cerrar sesión
            </a>
        </div>
    </aside>
    <main class="flex-1 flex flex-col min-w-0">
        <header class="h-16 px-8 border-b border-[#1e1e2d] flex items-center justify-between bg-[#12121a]/40 backdrop-blur-md">
            <h1 class="text-base font-semibold text-white">Vulnerabilidades</h1>
        </header>
        <div class="p-8 space-y-6 overflow-y-auto">
            <!-- Summary Cards -->
            <h2 class="text-xl font-bold text-white">Resumen de Vulnerabilidades</h2>
            <div id="vuln-cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

            <!-- Vulnerability List -->
            <div id="vuln-list-section" class="hidden">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-bold text-white">Detalle de Vulnerabilidades</h2>
                    <div class="flex gap-2">
                        <button onclick="filtrarVuln('todas')" id="btn-todas" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-[#6c47ff]/20 text-[#8b5cf6] border border-[#6c47ff]/30 transition-all">Todas</button>
                        <button onclick="filtrarVuln('High')" id="btn-high" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-red-500/10 text-red-400 border border-red-500/20 transition-all hover:bg-red-500/20">Críticas</button>
                        <button onclick="filtrarVuln('Medium')" id="btn-medium" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-orange-500/10 text-orange-400 border border-orange-500/20 transition-all hover:bg-orange-500/20">Altas</button>
                        <button onclick="filtrarVuln('Low')" id="btn-low" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-green-500/10 text-green-400 border border-green-500/20 transition-all hover:bg-green-500/20">Bajas</button>
                    </div>
                </div>
                <div id="vuln-list" class="space-y-3"></div>
            </div>

            <div id="vuln-empty" class="text-center py-16 hidden">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-emerald-500/10 border border-emerald-500/20 mb-4">
                    <i data-lucide="shield-check" class="w-10 h-10 text-emerald-400"></i>
                </div>
                <p class="text-xl font-bold text-white mb-2">Sin vulnerabilidades</p>
                <p class="text-gray-400">No se han detectado vulnerabilidades en tus analisis.</p>
                <a href="/nuevo-analisis" class="inline-flex items-center gap-2 mt-6 px-5 py-2.5 bg-[#6c47ff] text-white font-semibold text-sm rounded-xl hover:bg-[#5a35e6] transition-all">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i>
                    Ejecutar nuevo analisis
                </a>
            </div>
        </div>
    </main>
    <script>lucide.createIcons();</script>
<script>
const savedTheme = localStorage.getItem('tema') || 'oscuro';
document.body.classList.add('tema-' + savedTheme);
const savedDensity = localStorage.getItem('densidad') || 'normal';
document.body.classList.add('density-' + savedDensity);

let todasLasVulns = [];

const severityConfig = {
    High:   { color: 'red',     label: 'Crítico',  icon: 'alert-triangle', bg: 'bg-red-500/10',     border: 'border-red-500/20',     text: 'text-red-400',     badge: 'bg-red-500/20 text-red-300 border border-red-500/30' },
    Medium: { color: 'orange',  label: 'Alto',     icon: 'alert-circle',   bg: 'bg-orange-500/10',  border: 'border-orange-500/20',  text: 'text-orange-400',  badge: 'bg-orange-500/20 text-orange-300 border border-orange-500/30' },
    Low:    { color: 'green',   label: 'Bajo',     icon: 'info',           bg: 'bg-green-500/10',   border: 'border-green-500/20',   text: 'text-green-400',   badge: 'bg-green-500/20 text-green-300 border border-green-500/30' }
};

const typeConfig = {
    'Red':           { icon: 'wifi',           label: 'Red' },
    'Web':           { icon: 'globe',          label: 'Web' },
    'Base de Datos': { icon: 'database',       label: 'Base de Datos' },
    'Acceso Remoto': { icon: 'monitor',        label: 'Acceso Remoto' }
};

async function cargarVulnerabilidades() {
    try {
        const [sumRes, listRes] = await Promise.all([
            fetch('/api/vulnerabilidades/summary'),
            fetch('/api/vulnerabilidades/lista')
        ]);
        const sumData = await sumRes.json();
        const listData = await listRes.json();

        renderSummary(sumData.summary || {});
        todasLasVulns = listData.vulnerabilidades || [];
        renderLista(todasLasVulns);
    } catch(e) { console.error(e); }
}

function renderSummary(summary) {
    const container = document.getElementById('vuln-cards');
    container.innerHTML = '';

    const severityOrder = ['High', 'Medium', 'Low'];
    let total = 0;

    for (const sev of severityOrder) {
        const count = summary[sev] || 0;
        total += count;
        const cfg = severityConfig[sev];

        const card = document.createElement('div');
        card.className = `${cfg.bg} border ${cfg.border} rounded-2xl p-6 transition-all hover:shadow-lg hover:shadow-${cfg.color}-500/10`;
        card.innerHTML = `
            <div class="flex items-center gap-3 mb-3">
                <div class="w-11 h-11 rounded-xl ${cfg.bg} border ${cfg.border} flex items-center justify-center">
                    <i data-lucide="${cfg.icon}" class="w-5 h-5 ${cfg.text}"></i>
                </div>
                <div>
                    <p class="text-xs ${cfg.text} uppercase tracking-wider font-semibold">${cfg.label}</p>
                    <p class="text-2xl font-extrabold text-white">${count}</p>
                </div>
            </div>
            <p class="text-xs text-gray-500">Vulnerabilidades detectadas</p>
        `;
        container.appendChild(card);
    }

    const totalCard = document.createElement('div');
    totalCard.className = 'bg-[#6c47ff]/10 border border-[#6c47ff]/20 rounded-2xl p-6 transition-all';
    totalCard.innerHTML = `
        <div class="flex items-center gap-3 mb-3">
            <div class="w-11 h-11 rounded-xl bg-[#6c47ff]/20 border border-[#6c47ff]/30 flex items-center justify-center">
                <i data-lucide="shield-alert" class="w-5 h-5 text-[#8b5cf6]"></i>
            </div>
            <div>
                <p class="text-xs text-[#8b5cf6] uppercase tracking-wider font-semibold">Total</p>
                <p class="text-2xl font-extrabold text-white">${total}</p>
            </div>
        </div>
        <p class="text-xs text-gray-500">Vulnerabilidades encontradas</p>
    `;
    container.appendChild(totalCard);
    lucide.createIcons();
}

function renderLista(vulns) {
    const listSection = document.getElementById('vuln-list-section');
    const listContainer = document.getElementById('vuln-list');
    const emptyMsg = document.getElementById('vuln-empty');

    listContainer.innerHTML = '';

    if (vulns.length === 0) {
        listSection.classList.add('hidden');
        emptyMsg.classList.remove('hidden');
        lucide.createIcons();
        return;
    }

    emptyMsg.classList.add('hidden');
    listSection.classList.remove('hidden');

    for (const v of vulns) {
        const sev = v.severity || 'Low';
        const cfg = severityConfig[sev] || severityConfig['Low'];
        const typ = typeConfig[v.tipo] || { icon: 'help-circle', label: v.tipo || 'General' };

        const card = document.createElement('div');
        card.className = `bg-[#14141a] border ${cfg.border} rounded-2xl p-5 transition-all hover:shadow-lg hover:shadow-${cfg.color}-500/10 cursor-pointer`;
        card.setAttribute('data-severity', sev);
        card.onclick = () => toggleDetalle(card);

        card.innerHTML = `
            <div class="flex items-start justify-between gap-4">
                <div class="flex items-start gap-4 flex-1 min-w-0">
                    <div class="w-10 h-10 rounded-xl ${cfg.bg} border ${cfg.border} flex items-center justify-center shrink-0 mt-0.5">
                        <i data-lucide="${cfg.icon}" class="w-5 h-5 ${cfg.text}"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 flex-wrap mb-1">
                            <h3 class="text-sm font-bold text-white">${v.nombre}</h3>
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${cfg.badge}">${cfg.label}</span>
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-gray-500/10 text-gray-400 border border-gray-500/20">${typ.label}</span>
                        </div>
                        <p class="text-xs text-gray-400 leading-relaxed">${v.descripcion}</p>
                    </div>
                </div>
                <i data-lucide="chevron-down" class="w-4 h-4 text-gray-500 shrink-0 mt-1 transition-transform duration-200"></i>
            </div>
            <div class="detalle-contenido hidden mt-4 pt-4 border-t border-[#1e1e2d]">
                <div class="bg-[#0d0d12] rounded-xl p-4 border border-emerald-500/10">
                    <div class="flex items-center gap-2 mb-2">
                        <i data-lucide="lightbulb" class="w-4 h-4 text-emerald-400"></i>
                        <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider">Recomendación</span>
                    </div>
                    <p class="text-sm text-gray-300 leading-relaxed">${v.risk || 'No hay recomendación disponible.'}</p>
                </div>
                ${v.cve && v.cve !== 'CVE-General' ? `
                <div class="mt-3 flex items-center gap-2 text-xs text-gray-500">
                    <i data-lucide="link" class="w-3 h-3"></i>
                    <span>CVE: <span class="text-gray-400 font-mono">${v.cve}</span></span>
                </div>` : ''}
            </div>
        `;
        listContainer.appendChild(card);
    }
    lucide.createIcons();
}

function toggleDetalle(card) {
    const detalle = card.querySelector('.detalle-contenido');
    const chevron = card.querySelector('[data-lucide="chevron-down"]');
    if (detalle.classList.contains('hidden')) {
        detalle.classList.remove('hidden');
        chevron.style.transform = 'rotate(180deg)';
    } else {
        detalle.classList.add('hidden');
        chevron.style.transform = '';
    }
}

function filtrarVuln(filtro) {
    document.querySelectorAll('#vuln-list-section button').forEach(b => {
        b.classList.remove('bg-[#6c47ff]/20', 'bg-red-500/20', 'bg-orange-500/20', 'bg-green-500/20');
    });

    if (filtro === 'todas') {
        document.getElementById('btn-todas').classList.add('bg-[#6c47ff]/20');
        renderLista(todasLasVulns);
    } else {
        const btnId = 'btn-' + filtro.toLowerCase();
        const btn = document.getElementById(btnId);
        if (btn) btn.classList.add(severityConfig[filtro].bg.replace('/10', '/20'));
        renderLista(todasLasVulns.filter(v => v.severity === filtro));
    }
}

cargarVulnerabilidades();
</script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.body.classList.add('density-' + (localStorage.getItem('densidad') || 'normal'));
        });
    </script>
</body>
</html>
