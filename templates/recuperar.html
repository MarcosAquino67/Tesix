<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>SecureScan - Recuperar contraseña</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { background-color: #0d0d12; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center text-gray-200">

    <div class="w-full max-w-md bg-[#14141e] border border-[#1e1e2d] rounded-2xl p-8 space-y-6">

        <div class="text-center space-y-3">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-[#6c47ff]/20 border border-[#6c47ff]/30 text-[#6c47ff]">
                <i data-lucide="key" class="w-7 h-7"></i>
            </div>
            <h1 class="text-xl font-bold text-white">Recuperar contraseña</h1>
            <p class="text-xs text-gray-400">Ingresa tu usuario y te asignaremos una contraseña temporal</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="px-4 py-3 rounded-xl text-xs font-medium border
                        {% if category == 'success' %}bg-emerald-500/10 border-emerald-500/30 text-emerald-400
                        {% elif category == 'error' %}bg-red-500/10 border-red-500/30 text-red-400
                        {% else %}bg-blue-500/10 border-blue-500/30 text-blue-400{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/recuperar" method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="block text-xs font-medium text-gray-300 mb-1.5">Usuario</label>
                <input type="text" name="username" required
                    class="w-full bg-[#0d0d12] border border-[#232333] rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#6c47ff]">
            </div>
            <button type="submit" class="w-full bg-[#6c47ff] hover:bg-[#5b3adb] text-white font-semibold py-3 rounded-xl text-sm transition-all">
                Generar contraseña temporal
            </button>
        </form>

        <div class="text-center">
            <a href="/" class="text-xs text-gray-400 hover:text-white">← Volver al inicio de sesión</a>
        </div>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
